<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Appointments – MediCare Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body style="background:#f4f8fb;">

<div class="admin-sidebar">
  <div class="sidebar-logo"><i class="bi bi-heart-pulse-fill me-2"></i>Medi<span>Care</span></div>
  <nav class="sidebar-nav">
    <a href="dashboard.html"><i class="bi bi-speedometer2"></i>Dashboard</a>
    <a href="doctors.html"><i class="bi bi-people-fill"></i>Manage Doctors</a>
    <a href="appointments.html" class="active"><i class="bi bi-calendar-check-fill"></i>Appointments</a>
    <a href="../index.html" target="_blank"><i class="bi bi-house-fill"></i>View Website</a>
  </nav>
  <div style="margin-top:auto; padding:1.5rem;">
    <button onclick="logout()" style="width:100%; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:rgba(255,255,255,0.8); padding:0.6rem; border-radius:8px; cursor:pointer; font-size:0.88rem;">
      <i class="bi bi-box-arrow-right me-2"></i>Logout
    </button>
  </div>
</div>

<div class="admin-main">
  <div class="admin-topbar">
    <h5 class="mb-0" style="font-family:'Playfair Display',serif;">All Appointments</h5>
    <div class="d-flex gap-2">
      <select id="statusFilter" class="form-select form-select-sm" style="width:auto; border-color:var(--border);">
        <option value="">All Status</option>
        <option value="pending">Pending</option>
        <option value="confirmed">Confirmed</option>
        <option value="cancelled">Cancelled</option>
      </select>
      <input type="text" id="searchInput" class="form-control form-select-sm" placeholder="Search patient..." style="width:180px; border-color:var(--border);" />
    </div>
  </div>

  <div id="alert" class="mb-3 d-none"></div>

  <div class="data-table">
    <div class="table-responsive">
      <table class="table">
        <thead>
          <tr><th>#</th><th>Patient</th><th>Phone</th><th>Email</th><th>Doctor</th><th>Date</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody id="appointmentsTable">
          <tr><td colspan="8" class="text-center py-4">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
let allAppointments = [];

async function checkAuth() {
  const res = await fetch('/api/admin/check', { credentials: 'include' });
  const data = await res.json();
  if (!data.success) window.location.href = '/admin/login.html';
}

async function loadAppointments() {
  const res = await fetch('/api/appointments', { credentials: 'include' });
  const data = await res.json();
  allAppointments = data.appointments || [];
  renderTable(allAppointments);
}

function renderTable(appointments) {
  const tbody = document.getElementById('appointmentsTable');
  if (appointments.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-5"><i class="bi bi-calendar-x" style="font-size:2rem;"></i><br>No appointments found.</td></tr>';
    return;
  }
  tbody.innerHTML = appointments.map((a, i) => `
    <tr>
      <td>${i + 1}</td>
      <td><strong>${a.patient_name}</strong><br><small class="text-muted">${a.message ? a.message.substring(0,40) + (a.message.length > 40 ? '...' : '') : ''}</small></td>
      <td><a href="tel:${a.phone}" style="color:var(--primary-light);">${a.phone}</a></td>
      <td><small>${a.email}</small></td>
      <td><strong>${a.doctor_name || '–'}</strong><br><small class="text-muted">${a.specialization || ''}</small></td>
      <td><small>${a.appointment_date}</small><br><small class="text-muted">${new Date(a.created_at).toLocaleDateString()}</small></td>
      <td>
        <select onchange="updateStatus(${a.id}, this.value)" class="form-select form-select-sm" style="width:120px; border-color:var(--border); font-size:0.8rem;">
          <option value="pending" ${a.status === 'pending' ? 'selected' : ''}>Pending</option>
          <option value="confirmed" ${a.status === 'confirmed' ? 'selected' : ''}>Confirmed</option>
          <option value="cancelled" ${a.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
        </select>
      </td>
      <td>
        <button onclick="deleteAppointment(${a.id})" class="btn btn-sm" style="background:#fde8e8; border:1px solid #f5c0c0; border-radius:6px;">
          <i class="bi bi-trash-fill" style="color:var(--danger);"></i>
        </button>
      </td>
    </tr>`).join('');
}

async function updateStatus(id, status) {
  const res = await fetch(`/api/appointments/${id}/status`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify({ status })
  });
  const data = await res.json();
  showAlert(data.success, data.message);
  if (data.success) loadAppointments();
}

async function deleteAppointment(id) {
  if (!confirm('Delete this appointment?')) return;
  const res = await fetch(`/api/appointments/${id}`, { method: 'DELETE', credentials: 'include' });
  const data = await res.json();
  showAlert(data.success, data.message);
  if (data.success) loadAppointments();
}

function showAlert(success, message) {
  const alertBox = document.getElementById('alert');
  alertBox.className = success ? 'mb-3 alert-success-custom' : 'mb-3 alert-error-custom';
  alertBox.innerHTML = `<i class="bi bi-${success ? 'check' : 'x'}-circle-fill"></i><span>${message}</span>`;
  alertBox.classList.remove('d-none');
  setTimeout(() => alertBox.classList.add('d-none'), 3000);
}

document.getElementById('statusFilter').addEventListener('change', applyFilters);
document.getElementById('searchInput').addEventListener('input', applyFilters);

function applyFilters() {
  const status = document.getElementById('statusFilter').value;
  const search = document.getElementById('searchInput').value.toLowerCase();
  const filtered = allAppointments.filter(a => {
    const matchStatus = !status || a.status === status;
    const matchSearch = !search || a.patient_name.toLowerCase().includes(search) || (a.doctor_name || '').toLowerCase().includes(search);
    return matchStatus && matchSearch;
  });
  renderTable(filtered);
}

async function logout() {
  await fetch('/api/admin/logout', { method: 'POST', credentials: 'include' });
  window.location.href = '/admin/login.html';
}

checkAuth();
loadAppointments();
</script>
</body>
</html>
