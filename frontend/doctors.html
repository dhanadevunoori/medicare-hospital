<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Doctors – MediCare Hospital</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="index.html"><i class="bi bi-heart-pulse-fill"></i> Medi<span>Care</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto align-items-center gap-1">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link active" href="doctors.html">Doctors</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        <li class="nav-item ms-2"><a class="nav-link btn-appointment-nav" href="appointment.html">Book Appointment</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="page-header">
  <div class="container">
    <h1><i class="bi bi-people-fill me-2"></i>Our Specialist Doctors</h1>
    <p>Meet our team of experienced and dedicated medical professionals</p>
  </div>
</div>

<section class="section-pad">
  <div class="container">
    <!-- Search/Filter -->
    <div class="row mb-5">
      <div class="col-md-6 mb-3">
        <input type="text" id="searchInput" class="form-control" placeholder="🔍  Search doctor by name or specialization..." />
      </div>
      <div class="col-md-4">
        <select id="specializationFilter" class="form-select">
          <option value="">All Specializations</option>
        </select>
      </div>
    </div>
    <div class="row g-4" id="doctorsGrid">
      <div class="col-12 text-center py-5">
        <div class="spinner" style="width:32px;height:32px;border-width:4px;border-top-color:var(--primary);border-color:var(--border);"></div>
        <p class="text-muted mt-3">Loading doctors...</p>
      </div>
    </div>
    <div id="noDoctors" class="text-center py-5 d-none">
      <i class="bi bi-person-x" style="font-size:3rem;color:var(--text-muted);"></i>
      <p class="text-muted mt-2">No doctors match your search.</p>
    </div>
  </div>
</section>

<footer>
  <div class="container">
    <div class="footer-bottom text-center">
      <p>© 2024 MediCare Hospital. All rights reserved.</p>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
let allDoctors = [];

async function loadDoctors() {
  try {
    const res = await fetch('/api/doctors');
    const data = await res.json();
    allDoctors = data.doctors || [];

    // Populate filter
    const specs = [...new Set(allDoctors.map(d => d.specialization))];
    const filter = document.getElementById('specializationFilter');
    specs.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s; opt.textContent = s;
      filter.appendChild(opt);
    });

    renderDoctors(allDoctors);
  } catch(e) {
    document.getElementById('doctorsGrid').innerHTML = '<div class="col-12 text-center text-danger">Failed to load doctors. Make sure the server is running.</div>';
  }
}

function renderDoctors(doctors) {
  const grid = document.getElementById('doctorsGrid');
  const noMsg = document.getElementById('noDoctors');
  if (doctors.length === 0) {
    grid.innerHTML = '';
    noMsg.classList.remove('d-none');
    return;
  }
  noMsg.classList.add('d-none');
  grid.innerHTML = doctors.map(d => `
    <div class="col-sm-6 col-lg-4">
      <div class="doctor-card h-100">
        <div class="doctor-card-img"><i class="bi bi-person-circle"></i></div>
        <div class="doctor-card-body d-flex flex-column">
          <div class="specialization-badge">${d.specialization}</div>
          <h5>${d.name}</h5>
          ${d.bio ? `<p class="text-muted small flex-grow-1">${d.bio}</p>` : ''}
          <div class="available-days mb-3"><i class="bi bi-calendar3 mt-1"></i><span>${d.available_days}</span></div>
          <a href="appointment.html?doctor=${d.id}" class="btn-primary-custom" style="background:linear-gradient(135deg,var(--primary),var(--primary-light)); font-size:0.88rem; padding:0.65rem 1.4rem; justify-content:center;">
            <i class="bi bi-calendar-plus"></i> Book Appointment
          </a>
        </div>
      </div>
    </div>`).join('');
}

document.getElementById('searchInput').addEventListener('input', applyFilters);
document.getElementById('specializationFilter').addEventListener('change', applyFilters);

function applyFilters() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const spec = document.getElementById('specializationFilter').value;
  const filtered = allDoctors.filter(d => {
    const matchSearch = d.name.toLowerCase().includes(search) || d.specialization.toLowerCase().includes(search);
    const matchSpec = !spec || d.specialization === spec;
    return matchSearch && matchSpec;
  });
  renderDoctors(filtered);
}

loadDoctors();
</script>
</body>
</html>
