<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Doctors – MediCare Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body style="background:#f4f8fb;">

<div class="admin-sidebar">
  <div class="sidebar-logo"><i class="bi bi-heart-pulse-fill me-2"></i>Medi<span>Care</span></div>
  <nav class="sidebar-nav">
    <a href="dashboard.html"><i class="bi bi-speedometer2"></i>Dashboard</a>
    <a href="doctors.html" class="active"><i class="bi bi-people-fill"></i>Manage Doctors</a>
    <a href="appointments.html"><i class="bi bi-calendar-check-fill"></i>Appointments</a>
    <a href="../index.html" target="_blank"><i class="bi bi-house-fill"></i>View Website</a>
  </nav>
  <div style="margin-top:auto; padding:1.5rem;">
    <button onclick="logout()" style="width:100%; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:rgba(255,255,255,0.8); padding:0.6rem; border-radius:8px; cursor:pointer; font-size:0.88rem;">
      <i class="bi bi-box-arrow-right me-2"></i>Logout
    </button>
  </div>
</div>

<div class="admin-main">
  <div class="admin-topbar">
    <h5 class="mb-0" style="font-family:'Playfair Display',serif;">Manage Doctors</h5>
    <button class="btn btn-sm" style="background:linear-gradient(135deg,var(--primary),var(--primary-light)); color:white; border:none; border-radius:8px; padding:0.5rem 1.2rem; font-weight:600;"
      onclick="openModal()">
      <i class="bi bi-plus-lg me-1"></i>Add Doctor
    </button>
  </div>

  <div id="alert" class="mb-3 d-none"></div>

  <div class="data-table">
    <div class="table-responsive">
      <table class="table">
        <thead>
          <tr>
            <th>#</th><th>Name</th><th>Specialization</th><th>Available Days</th><th>Bio</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="doctorsTable">
          <tr><td colspan="6" class="text-center py-4">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="doctorModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content" style="border-radius:var(--radius-lg); border:none;">
      <div class="modal-header" style="border-bottom:1px solid var(--border);">
        <h5 class="modal-title" id="modalTitle" style="font-family:'Playfair Display',serif; color:var(--primary);">Add Doctor</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4">
        <input type="hidden" id="doctorId" />
        <div class="mb-3">
          <label class="form-label">Full Name *</label>
          <input type="text" id="dName" class="form-control" placeholder="Dr. John Smith" />
        </div>
        <div class="mb-3">
          <label class="form-label">Specialization *</label>
          <input type="text" id="dSpec" class="form-control" placeholder="e.g. Cardiologist" />
        </div>
        <div class="mb-3">
          <label class="form-label">Available Days *</label>
          <input type="text" id="dDays" class="form-control" placeholder="Monday, Wednesday, Friday" />
        </div>
        <div class="mb-3">
          <label class="form-label">Bio / Description</label>
          <textarea id="dBio" class="form-control" rows="3" placeholder="Brief description about the doctor..."></textarea>
        </div>
      </div>
      <div class="modal-footer" style="border-top:1px solid var(--border);">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn" style="background:linear-gradient(135deg,var(--primary),var(--primary-light)); color:white; border:none; border-radius:8px; padding:0.5rem 1.5rem; font-weight:600;" onclick="saveDoctor()" id="saveBtn">Save Doctor</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const modal = new bootstrap.Modal(document.getElementById('doctorModal'));

async function checkAuth() {
  const res = await fetch('/api/admin/check', { credentials: 'include' });
  const data = await res.json();
  if (!data.success) window.location.href = '/admin/login.html';
}

async function loadDoctors() {
  const res = await fetch('/api/doctors');
  const data = await res.json();
  const tbody = document.getElementById('doctorsTable');
  if (!data.success || data.doctors.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">No doctors found. Add one!</td></tr>';
    return;
  }
  tbody.innerHTML = data.doctors.map((d, i) => `
    <tr>
      <td>${i + 1}</td>
      <td><strong>${d.name}</strong></td>
      <td><span class="specialization-badge">${d.specialization}</span></td>
      <td><small style="color:var(--text-muted);">${d.available_days}</small></td>
      <td><small style="max-width:200px; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${d.bio || '–'}</small></td>
      <td>
        <button onclick="editDoctor(${d.id})" class="btn btn-sm me-1" style="background:var(--bg-light); border:1px solid var(--border); border-radius:6px;">
          <i class="bi bi-pencil-fill" style="color:var(--primary-light);"></i>
        </button>
        <button onclick="deleteDoctor(${d.id}, '${d.name}')" class="btn btn-sm" style="background:#fde8e8; border:1px solid #f5c0c0; border-radius:6px;">
          <i class="bi bi-trash-fill" style="color:var(--danger);"></i>
        </button>
      </td>
    </tr>`).join('');
}

function openModal(doctor = null) {
  document.getElementById('doctorId').value = doctor ? doctor.id : '';
  document.getElementById('dName').value = doctor ? doctor.name : '';
  document.getElementById('dSpec').value = doctor ? doctor.specialization : '';
  document.getElementById('dDays').value = doctor ? doctor.available_days : '';
  document.getElementById('dBio').value = doctor ? (doctor.bio || '') : '';
  document.getElementById('modalTitle').textContent = doctor ? 'Edit Doctor' : 'Add New Doctor';
  modal.show();
}

async function editDoctor(id) {
  const res = await fetch(`/api/doctors/${id}`);
  const data = await res.json();
  if (data.success) openModal(data.doctor);
}

async function saveDoctor() {
  const id = document.getElementById('doctorId').value;
  const payload = {
    name: document.getElementById('dName').value.trim(),
    specialization: document.getElementById('dSpec').value.trim(),
    available_days: document.getElementById('dDays').value.trim(),
    bio: document.getElementById('dBio').value.trim()
  };

  if (!payload.name || !payload.specialization || !payload.available_days) {
    alert('Please fill all required fields.'); return;
  }

  const url = id ? `/api/doctors/${id}` : '/api/doctors';
  const method = id ? 'PUT' : 'POST';

  const res = await fetch(url, {
    method,
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify(payload)
  });
  const data = await res.json();

  const alertBox = document.getElementById('alert');
  alertBox.className = data.success ? 'mb-3 alert-success-custom' : 'mb-3 alert-error-custom';
  alertBox.innerHTML = `<i class="bi bi-${data.success ? 'check' : 'x'}-circle-fill"></i><span>${data.message}</span>`;
  alertBox.classList.remove('d-none');

  if (data.success) { modal.hide(); loadDoctors(); }
  setTimeout(() => alertBox.classList.add('d-none'), 4000);
}

async function deleteDoctor(id, name) {
  if (!confirm(`Delete Dr. ${name}? This cannot be undone.`)) return;
  const res = await fetch(`/api/doctors/${id}`, { method: 'DELETE', credentials: 'include' });
  const data = await res.json();
  const alertBox = document.getElementById('alert');
  alertBox.className = data.success ? 'mb-3 alert-success-custom' : 'mb-3 alert-error-custom';
  alertBox.innerHTML = `<i class="bi bi-${data.success ? 'check' : 'x'}-circle-fill"></i><span>${data.message}</span>`;
  alertBox.classList.remove('d-none');
  if (data.success) loadDoctors();
  setTimeout(() => alertBox.classList.add('d-none'), 3000);
}

async function logout() {
  await fetch('/api/admin/logout', { method: 'POST', credentials: 'include' });
  window.location.href = '/admin/login.html';
}

checkAuth();
loadDoctors();
</script>
</body>
</html>
